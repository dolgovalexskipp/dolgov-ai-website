<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Дирижёр команды AI-агентов</title>

  <defs>
    <style>
      .paper { fill: #f6f0e6; }
      .g900 { fill: #173a28; }
      .g700 { fill: #3a754d; }
      .muted { fill: #67635d; }
      .brick { fill: #b85a3a; }
      .white { fill: #f6f0e6; }
      .stroke { stroke: #173a28; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; fill: none; }
      .text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 14px; fill: #173a28; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- background -->
  <rect class="paper" x="0" y="0" width="480" height="440"/>

  <!-- connection lines (behind everything) -->
  <g stroke="#173a28" stroke-width="1.5" fill="none">
    <line x1="240" y1="220" x2="90"  y2="115"/>
    <line x1="240" y1="220" x2="390" y2="115"/>
    <line x1="240" y1="220" x2="60"  y2="260"/>
    <line x1="240" y1="220" x2="420" y2="260"/>
    <line x1="240" y1="220" x2="240" y2="385"/>
  </g>

  <!-- Speech bubble: CRYSTALLIZING… -->
  <g>
    <rect x="165" y="22" width="170" height="38" rx="19" fill="#f6f0e6" stroke="#173a28" stroke-width="2.5"/>
    <path d="M230 60 L240 74 L248 60 Z" fill="#f6f0e6" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="250" y="47" text-anchor="middle" class="text">CRYSTALLIZING…</text>
  </g>

  <!-- Agent TL: triangle, dark green -->
  <g>
    <polygon points="90,75 55,130 125,130" class="g900" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="80" cy="115" r="3" fill="#f6f0e6"/>
    <circle cx="100" cy="115" r="3" fill="#f6f0e6"/>
  </g>

  <!-- Agent TR: square, medium green -->
  <g>
    <rect x="362" y="82" width="60" height="60" class="g700" stroke="#173a28" stroke-width="2.5"/>
    <circle cx="382" cy="112" r="3" fill="#173a28"/>
    <circle cx="402" cy="112" r="3" fill="#173a28"/>
  </g>

  <!-- Agent ML: circle, muted gray -->
  <g>
    <circle cx="60" cy="260" r="30" class="muted" stroke="#173a28" stroke-width="2.5"/>
    <circle cx="52" cy="258" r="3" fill="#173a28"/>
    <circle cx="68" cy="258" r="3" fill="#173a28"/>
  </g>

  <!-- Agent MR: half-circle (dome), dark green -->
  <g>
    <path d="M390 290 A30 30 0 0 1 450 290 L450 290 L390 290 Z" class="g900" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="412" cy="278" r="3" fill="#f6f0e6"/>
    <circle cx="428" cy="278" r="3" fill="#f6f0e6"/>
  </g>

  <!-- Central figure: conductor -->
  <g>
    <!-- head -->
    <circle cx="240" cy="135" r="30" class="g900" stroke="#173a28" stroke-width="2.5"/>
    <circle cx="230" cy="132" r="3.5" fill="#f6f0e6"/>
    <circle cx="250" cy="132" r="3.5" fill="#f6f0e6"/>
    <!-- torso -->
    <rect x="200" y="168" width="80" height="100" rx="6" class="g700" stroke="#173a28" stroke-width="2.5"/>
    <!-- arms (simple rectangles, no hands) -->
    <rect x="168" y="180" width="32" height="14" rx="3" class="g700" stroke="#173a28" stroke-width="2.5"/>
    <rect x="280" y="180" width="32" height="14" rx="3" class="g700" stroke="#173a28" stroke-width="2.5"/>
    <!-- legs -->
    <rect x="210" y="268" width="22" height="56" class="g900" stroke="#173a28" stroke-width="2.5"/>
    <rect x="248" y="268" width="22" height="56" class="g900" stroke="#173a28" stroke-width="2.5"/>
  </g>

  <!-- Agent bottom: brick square (accent) -->
  <g>
    <rect x="210" y="360" width="60" height="60" class="brick" stroke="#173a28" stroke-width="2.5"/>
    <circle cx="228" cy="390" r="3.5" fill="#173a28"/>
    <circle cx="252" cy="390" r="3.5" fill="#173a28"/>
  </g>

  <!-- subtle halftone dots on paper (top-right decorative) -->
  <g fill="#67635d" opacity="0.4">
    <circle cx="420" cy="40" r="1.5"/>
    <circle cx="430" cy="50" r="1.5"/>
    <circle cx="440" cy="40" r="1.5"/>
    <circle cx="410" cy="50" r="1.5"/>
    <circle cx="420" cy="60" r="1.5"/>
    <circle cx="430" cy="70" r="1.5"/>
    <circle cx="440" cy="60" r="1.5"/>
  </g>
</svg>
