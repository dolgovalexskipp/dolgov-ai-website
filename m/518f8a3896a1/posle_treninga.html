:root{--page-grad:linear-gradient(180deg,#eff4f7 0%,#f2f2f3 50%,#f5f5f4 100%);--card:#fff;--border:#e5e5e5;--hair:rgba(23,23,23,.06);--fg:#0a0a0a;--primary:#171717;--muted:#666;--accent:#177245;--danger:#d92d2d;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#f0f1f3}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--page-grad);color:var(--fg);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.head{background:rgba(255,255,255,.86);border-bottom:1px solid var(--hair)}
.head .in{max-width:960px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:6px;color:var(--primary);text-decoration:none}
.brand b{font:700 15px/1 var(--sans);letter-spacing:.03em;text-transform:uppercase}
.brand small{font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.brand small sup{font:500 8px/1 var(--sans);vertical-align:4px;margin-left:1px}
.mlabel{font:500 12px/1.4 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 10px 50px -30px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.07)}
h1{font:700 26px/1.15 var(--sans);letter-spacing:-.02em;margin:10px 0 8px}
.hint{color:var(--muted);font-size:15px;margin-bottom:22px}
label{display:block;font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input{width:100%;height:46px;padding:0 14px;border:1px solid var(--border);border-radius:12px;font:16px var(--sans);color:var(--fg);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,114,69,.12)}
button{width:100%;height:46px;margin-top:12px;border:0;border-radius:9999px;background:var(--primary);color:#fafafa;font:600 15px var(--sans);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(217,45,45,.06);color:var(--danger);font-size:14px}
.err.show{display:block}
.foot{text-align:center;padding:20px 16px;font-size:12px;color:var(--muted)}
</style>
</head>

const ITER = 600000;
const KEY = 'dai-pages:' + PAYLOAD.scope;
const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pwd) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b2u(PAYLOAD.salt), iterations: ITER, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2u(PAYLOAD.iv) }, key, b2u(PAYLOAD.ct));
  return new TextDecoder().decode(buf);
}
function show(html) { document.open(); document.write(html); document.close(); }
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pwd = document.getElementById('pwd').value, btn = document.getElementById('go'), err = document.getElementById('err');
  if (!pwd) return;
  err.classList.remove('show'); btn.disabled = true; btn.textContent = 'Открываю…';
  try { const html = await open_(pwd); try { sessionStorage.setItem(KEY, pwd); } catch (_) {} show(html); }
  catch (_) { err.classList.add('show'); btn.disabled = false; btn.textContent = 'Открыть'; document.getElementById('pwd').select(); }
});
(async () => { let p = null; try { p = sessionStorage.getItem(KEY); } catch (_) {}
  if (p) { try { show(await open_(p)); } catch (_) { try { sessionStorage.removeItem(KEY); } catch (_) {} } } })();
</script>
