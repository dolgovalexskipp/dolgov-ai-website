<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="sc1-title">
  <title id="sc1-title">Агент-секретарь: разговор превращается в задачи</title>

  <!-- background -->
  <rect fill="#f6f0e6" x="0" y="0" width="360" height="300"/>

  <!-- Speech bubble: PERCOLATING… -->
  <g>
    <rect x="14" y="16" width="150" height="32" rx="16" fill="#f6f0e6" stroke="#173a28" stroke-width="2.5"/>
    <path d="M48 48 L56 60 L64 48 Z" fill="#f6f0e6" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="89" y="37" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="13" fill="#173a28" letter-spacing="0.4">PERCOLATING…</text>
  </g>

  <!-- LEFT: vintage phone handset (stylized) -->
  <g transform="translate(40, 110)">
    <!-- handle bar -->
    <rect x="10" y="40" width="80" height="20" rx="10" fill="#173a28" stroke="#173a28" stroke-width="2.5"/>
    <!-- left earpiece -->
    <rect x="-2" y="20" width="28" height="40" rx="10" fill="#173a28" stroke="#173a28" stroke-width="2.5"/>
    <rect x="4" y="26" width="16" height="18" rx="4" fill="#3a754d" stroke="none"/>
    <!-- right earpiece (mouthpiece) -->
    <rect x="74" y="60" width="28" height="40" rx="10" fill="#173a28" stroke="#173a28" stroke-width="2.5"/>
    <rect x="80" y="70" width="16" height="18" rx="4" fill="#3a754d" stroke="none"/>
  </g>

  <!-- Sound waves -->
  <g fill="none" stroke="#3a754d" stroke-width="2.5" stroke-linecap="round">
    <path d="M150 140 Q160 130 170 140"/>
    <path d="M150 155 Q165 140 180 155"/>
    <path d="M150 170 Q170 150 190 170"/>
  </g>

  <!-- Arrow right -->
  <g stroke="#173a28" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="195" y1="155" x2="215" y2="155"/>
    <polyline points="210,148 220,155 210,162"/>
  </g>

  <!-- RIGHT: checklist -->
  <g transform="translate(230, 70)">
    <!-- paper card -->
    <rect x="0" y="0" width="115" height="180" rx="4" fill="#f6f0e6" stroke="#173a28" stroke-width="2.5"/>

    <!-- item 1 -->
    <rect x="12" y="20" width="18" height="18" fill="none" stroke="#173a28" stroke-width="2.5"/>
    <polyline points="15,28 22,35 32,22" fill="none" stroke="#173a28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="30" x2="100" y2="30" stroke="#67635d" stroke-width="2" stroke-linecap="round"/>

    <!-- item 2 -->
    <rect x="12" y="58" width="18" height="18" fill="none" stroke="#173a28" stroke-width="2.5"/>
    <polyline points="15,66 22,73 32,60" fill="none" stroke="#173a28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="68" x2="95" y2="68" stroke="#67635d" stroke-width="2" stroke-linecap="round"/>

    <!-- item 3 -->
    <rect x="12" y="96" width="18" height="18" fill="none" stroke="#173a28" stroke-width="2.5"/>
    <polyline points="15,104 22,111 32,98" fill="none" stroke="#173a28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="106" x2="92" y2="106" stroke="#67635d" stroke-width="2" stroke-linecap="round"/>

    <!-- item 4 — brick accent -->
    <rect x="12" y="134" width="18" height="18" fill="none" stroke="#173a28" stroke-width="2.5"/>
    <polyline points="15,142 22,149 32,136" fill="none" stroke="#b85a3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="144" x2="98" y2="144" stroke="#b85a3a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- subtle halftone (top right, small) -->
  <g fill="#67635d" opacity="0.4">
    <circle cx="332" cy="18" r="1.5"/>
    <circle cx="340" cy="26" r="1.5"/>
    <circle cx="348" cy="18" r="1.5"/>
    <circle cx="324" cy="26" r="1.5"/>
    <circle cx="332" cy="34" r="1.5"/>
  </g>
</svg>
