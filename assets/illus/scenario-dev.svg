<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="sc3-title">
  <title id="sc3-title">Non-tech фаундер: тикет превращается в деплой</title>

  <rect fill="#f6f0e6" x="0" y="0" width="360" height="300"/>

  <!-- Speech bubble SHIPPING! (top right) -->
  <g transform="translate(210, 20)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#f6f0e6" stroke="#173a28" stroke-width="2.5"/>
    <path d="M30 34 L38 46 L46 34 Z" fill="#f6f0e6" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="65" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="14" fill="#173a28" letter-spacing="0.5">SHIPPING!</text>
  </g>

  <!-- LEFT COLUMN centered around x=120 -->

  <!-- Ticket at top -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="160" height="70" rx="4" fill="#f6f0e6" stroke="#173a28" stroke-width="2.5"/>
    <rect x="0" y="0" width="160" height="18" fill="#173a28"/>
    <text x="10" y="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="10" fill="#f6f0e6" letter-spacing="0.3">TICKET · TASK-482</text>
    <line x1="12" y1="32" x2="140" y2="32" stroke="#67635d" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="42" x2="120" y2="42" stroke="#67635d" stroke-width="2" stroke-linecap="round"/>
    <rect x="12" y="52" width="10" height="10" fill="none" stroke="#173a28" stroke-width="2"/>
    <line x1="28" y1="57" x2="90" y2="57" stroke="#67635d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Arrow down -->
  <g stroke="#173a28" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="120" y1="105" x2="120" y2="127"/>
    <polyline points="113,120 120,130 127,120"/>
  </g>

  <!-- 3 agents row centered at x=120 -->
  <g transform="translate(40, 140)">
    <!-- architect: triangle (dark green) -->
    <polygon points="25,0 50,40 0,40" fill="#173a28" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="18" cy="30" r="2.8" fill="#f6f0e6"/>
    <circle cx="32" cy="30" r="2.8" fill="#f6f0e6"/>

    <!-- dev: circle (medium green) -->
    <circle cx="80" cy="20" r="22" fill="#3a754d" stroke="#173a28" stroke-width="2.5"/>
    <circle cx="72" cy="18" r="2.8" fill="#173a28"/>
    <circle cx="88" cy="18" r="2.8" fill="#173a28"/>

    <!-- reviewer: square (muted gray) -->
    <rect x="120" y="0" width="40" height="40" fill="#67635d" stroke="#173a28" stroke-width="2.5"/>
    <circle cx="132" cy="20" r="2.8" fill="#f6f0e6"/>
    <circle cx="148" cy="20" r="2.8" fill="#f6f0e6"/>
  </g>

  <!-- Arrow down -->
  <g stroke="#173a28" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="120" y1="190" x2="120" y2="212"/>
    <polyline points="113,205 120,215 127,205"/>
  </g>

  <!-- Rocket at bottom (brick accent) -->
  <g transform="translate(120, 225)">
    <!-- rocket body -->
    <path d="M 0,-8
             C -14,-8 -14,10 -14,22
             L -14,40
             L 14,40
             L 14,22
             C 14,10 14,-8 0,-8
             Z"
          fill="#b85a3a" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- nose cone -->
    <path d="M -14,-8 L 0,-32 L 14,-8 Z" fill="#b85a3a" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- window -->
    <circle cx="0" cy="10" r="6" fill="#f6f0e6" stroke="#173a28" stroke-width="2"/>
    <!-- fins -->
    <polygon points="-14,24 -24,42 -14,42" fill="#173a28" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="14,24 24,42 14,42" fill="#173a28" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- flame -->
    <path d="M -8,42 L 0,58 L 8,42 Z" fill="#173a28" stroke="#173a28" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Halftone motion dots behind rocket -->
  <g fill="#67635d" opacity="0.5">
    <circle cx="235" cy="235" r="2"/>
    <circle cx="248" cy="240" r="2"/>
    <circle cx="262" cy="230" r="2"/>
    <circle cx="255" cy="252" r="2"/>
    <circle cx="272" cy="248" r="2"/>
    <circle cx="285" cy="238" r="2"/>
  </g>

  <!-- Top-right halftone decorative -->
  <g fill="#67635d" opacity="0.4">
    <circle cx="308" cy="110" r="1.5"/>
    <circle cx="316" cy="118" r="1.5"/>
    <circle cx="324" cy="110" r="1.5"/>
    <circle cx="300" cy="118" r="1.5"/>
    <circle cx="308" cy="126" r="1.5"/>
  </g>
</svg>
